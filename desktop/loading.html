<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>TickeTess</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(226, 232, 240, 0.25);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      p {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.02em;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p>Abrindo TickeTess...</p>
  </body>
</html>
